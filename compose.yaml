services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AJO_DEMO_MODE: "true"
    volumes:
      - ajo-demo:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    profiles: [scheduler]
    command: ["python", "-m", "app.platform.cli", "worker"]
    environment:
      AJO_DEMO_MODE: "true"
    volumes:
      - ajo-demo:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  ajo-demo:
