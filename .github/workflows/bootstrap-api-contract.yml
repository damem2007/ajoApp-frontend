name: bootstrap-api-contract

on:
  push:
    branches: ["architecture/consolidated-upgrade"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: damem2007/ajoApp
          ref: architecture/consolidated-upgrade
          path: backend-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-contract/pyproject.toml
      - run: python -m pip install -e './backend-contract[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: AJO_BACKEND_DIR="$GITHUB_WORKSPACE/backend-contract" npm run api:types
      - name: Commit deterministic generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/generated/api-types.ts
          if ! git diff --cached --quiet; then
            git commit -m "Generate FastAPI TypeScript contract"
            git push origin HEAD:architecture/consolidated-upgrade
          fi
